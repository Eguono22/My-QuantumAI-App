name: Production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -c ../requirements.lock.txt

      - name: Run backend tests
        run: python -m pytest tests/backend/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Run frontend tests
        run: cd frontend && npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          CI: false

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@65.0.0

      - name: Deploy without moving production aliases
        id: deployment
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[[:alnum:].-]+\.vercel\.app$ ]]; then
            echo "Vercel CLI did not return a valid deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify deployment before promotion
        run: python scripts/production_check.py --base-url "${{ steps.deployment.outputs.url }}" --use-vercel-cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Promote healthy deployment
        run: python scripts/promote_production.py "${{ steps.deployment.outputs.url }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify production domain after promotion
        run: python scripts/production_check.py --base-url https://quantxai.app
